<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Doraemon Admin Control Panel</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 40px; display: flex; justify-content: center; }
    .box { background: #222; padding: 30px; border-radius: 10px; width: 100%; max-width: 450px; border: 2px solid #00a0e9; }
    h2 { color: #00a0e9; margin-bottom: 20px; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; }
    button { width: 100%; background: #e60012; color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 5px; }
  </style>
</head>
<body>

<div class="box">
  <h2>Admin Media Upload</h2>
  <div class="field">
    <label>Anywhere Door Video/Media:</label>
    <input type="file" id="doorFile" accept="video/*,image/*">
  </div>
  <div class="field">
    <label>Time Machine Destination Video/Media:</label>
    <input type="file" id="timeFile" accept="video/*,image/*">
  </div>
  <button onclick="broadcast()">Upload & Send to App</button>
</div>

<script>
  const channel = new BroadcastChannel('doraemon_admin_channel');

  function broadcast() {
    const dFile = document.getElementById('doorFile').files[0];
    const tFile = document.getElementById('timeFile').files[0];

    if (dFile) send(dFile, 'door');
    if (tFile) send(tFile, 'time');
    alert("Media sent successfully!");
  }

  function send(file, target) {
    const reader = new FileReader();
    reader.onload = (e) => {
      channel.postMessage({ target: target, mediaType: file.type, dataUrl: e.target.result });
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
